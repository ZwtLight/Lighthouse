<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户管理系统 · 增删改查</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 32px 16px 64px;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1f2937;
    background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 45%, #f1f5f9 100%);
  }

  .app { max-width: 960px; margin: 0 auto; }

  /* ---------- 头部 ---------- */
  .app-header { margin-bottom: 22px; }
  .app-header h1 {
    margin: 0 0 6px;
    font-size: 26px;
    letter-spacing: -0.3px;
    color: #111827;
  }
  .app-header p { margin: 0; font-size: 14px; color: #6b7280; }

  /* ---------- 卡片 ---------- */
  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px -12px rgba(16, 24, 40, .18);
    overflow: hidden;
  }

  /* ---------- 工具栏 ---------- */
  .toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    padding: 16px;
    border-bottom: 1px solid #f0f1f4;
  }
  .search { position: relative; flex: 1 1 240px; min-width: 180px; }
  .search::before {
    content: "🔍";
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    opacity: .55;
    pointer-events: none;
  }
  .search input {
    width: 100%;
    padding: 10px 14px 10px 34px;
    font-size: 14px;
    color: #111827;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 9px;
    outline: none;
    transition: .18s;
  }
  .search input:focus {
    background: #fff;
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, .13);
  }

  /* ---------- 按钮 ---------- */
  .btn {
    padding: 9px 16px;
    font-size: 14px;
    font-family: inherit;
    color: #374151;
    background: #fff;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    cursor: pointer;
    white-space: nowrap;
    transition: .16s;
  }
  .btn:hover { background: #f9fafb; border-color: #9ca3af; }
  .btn:active { transform: scale(.97); }

  .btn-primary {
    color: #fff;
    background: #4f46e5;
    border-color: #4f46e5;
    box-shadow: 0 4px 12px -4px rgba(79, 70, 229, .55);
  }
  .btn-primary:hover { background: #4338ca; border-color: #4338ca; }

  .btn-sm { padding: 5px 11px; font-size: 13px; border-radius: 7px; }

  .btn-danger { color: #dc2626; border-color: #fecaca; background: #fff; }
  .btn-danger:hover { background: #fef2f2; border-color: #f87171; }

  .btn-solid-danger {
    color: #fff; background: #dc2626; border-color: #dc2626;
  }
  .btn-solid-danger:hover { background: #b91c1c; border-color: #b91c1c; }

  /* ---------- 表格 ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    padding: 12px 16px;
    text-align: left;
    font-size: 12.5px;
    font-weight: 600;
    color: #6b7280;
    background: #fafbfc;
    white-space: nowrap;
    border-bottom: 1px solid #f0f1f4;
  }
  td {
    padding: 13px 16px;
    border-bottom: 1px solid #f4f5f7;
    vertical-align: middle;
  }
  tbody tr { transition: background .15s; }
  tbody tr:hover { background: #fafbff; }
  tbody tr:last-child td { border-bottom: none; }

  .tag {
    display: inline-block;
    padding: 2px 10px;
    font-size: 12.5px;
    color: #4338ca;
    background: #eef2ff;
    border-radius: 999px;
  }

  .ops { white-space: nowrap; }
  .ops .btn + .btn { margin-left: 8px; }

  .empty {
    display: none;
    padding: 56px 20px;
    text-align: center;
    font-size: 14px;
    color: #9ca3af;
  }
  .empty::before {
    content: "📭";
    display: block;
    margin-bottom: 10px;
    font-size: 32px;
  }

  .count {
    padding: 12px 16px;
    font-size: 13px;
    color: #6b7280;
    background: #fafbfc;
    border-top: 1px solid #f0f1f4;
  }

  /* ---------- 模态框 ---------- */
  .modal-mask {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(15, 23, 42, .45);
    backdrop-filter: blur(2px);
    opacity: 0;
    visibility: hidden;
    transition: .2s;
  }
  .modal-mask.show { opacity: 1; visibility: visible; }

  .modal {
    width: 100%;
    max-width: 440px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 24px 48px -12px rgba(15, 23, 42, .35);
    transform: translateY(12px) scale(.97);
    transition: .22s cubic-bezier(.2, .8, .3, 1);
  }
  .modal-mask.show .modal { transform: none; }
  .modal-sm { max-width: 380px; }

  .modal h2 {
    margin: 0 0 18px;
    font-size: 18px;
    color: #111827;
  }
  .modal p { margin: 0 0 22px; font-size: 14px; line-height: 1.6; color: #4b5563; }

  /* ---------- 表单 ---------- */
  .field { margin-bottom: 15px; }
  .field label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
  }
  .req { color: #dc2626; }
  .field input,
  .field select {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: #111827;
    background: #fff;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    outline: none;
    transition: .16s;
  }
  .field input:focus,
  .field select:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, .13);
  }
  .field input.invalid { border-color: #ef4444; }
  .field input.invalid:focus { box-shadow: 0 0 0 3px rgba(239, 68, 68, .13); }

  .err {
    display: block;
    margin-top: 5px;
    font-size: 12.5px;
    color: #dc2626;
    min-height: 0;
  }
  .err:empty { display: none; }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 24px;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    z-index: 200;
    padding: 10px 20px;
    font-size: 14px;
    color: #fff;
    background: #1f2937;
    border-radius: 10px;
    box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .5);
    transform: translate(-50%, -20px);
    opacity: 0;
    pointer-events: none;
    transition: .26s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 560px) {
    body { padding: 20px 10px 48px; }
    .app-header h1 { font-size: 21px; }
    th, td { padding: 11px 12px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <h1>用户管理系统</h1>
    <p>支持新增、查询、编辑、删除，数据保存在浏览器本地（localStorage）</p>
  </header>

  <div class="card">
    <div class="toolbar">
      <div class="search">
        <input type="text" id="searchInput" placeholder="搜索姓名 / 邮箱 / 部门…" autocomplete="off">
      </div>
      <button class="btn btn-primary" id="addBtn">+ 新增用户</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:70px">ID</th>
            <th>姓名</th>
            <th style="width:80px">年龄</th>
            <th>邮箱</th>
            <th style="width:110px">部门</th>
            <th style="width:150px">操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="emptyState"></div>
    </div>

    <div class="count" id="count"></div>
  </div>
</div>

<!-- ========== 新增 / 编辑 弹窗 ========== -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h2 id="modalTitle">新增用户</h2>
    <form id="userForm" novalidate>
      <div class="field">
        <label for="fName">姓名 <span class="req">*</span></label>
        <input type="text" id="fName" placeholder="请输入姓名" maxlength="20">
        <span class="err" id="err-fName"></span>
      </div>

      <div class="field">
        <label for="fAge">年龄 <span class="req">*</span></label>
        <input type="number" id="fAge" placeholder="请输入年龄（1-150）" min="1" max="150">
        <span class="err" id="err-fAge"></span>
      </div>

      <div class="field">
        <label for="fEmail">邮箱 <span class="req">*</span></label>
        <input type="text" id="fEmail" placeholder="example@mail.com" maxlength="60">
        <span class="err" id="err-fEmail"></span>
      </div>

      <div class="field">
        <label for="fDept">部门</label>
        <select id="fDept">
          <option>技术部</option>
          <option>产品部</option>
          <option>设计部</option>
          <option>市场部</option>
          <option>人事部</option>
          <option>财务部</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn" id="cancelBtn">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- ========== 删除确认弹窗 ========== -->
<div class="modal-mask" id="confirmMask">
  <div class="modal modal-sm">
    <h2>确认删除</h2>
    <p id="confirmText">确定要删除该用户吗？该操作不可撤销。</p>
    <div class="modal-actions">
      <button type="button" class="btn" id="cancelDelBtn">取消</button>
      <button type="button" class="btn btn-solid-danger" id="okDelBtn">删除</button>
    </div>
  </div>
</div>

<!-- ========== 提示条 ========== -->
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ============ 1. 数据层 ============ */
  const STORAGE_KEY = 'crud_demo_users_v1';

  const store = {
    get() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); }
      catch (e) { return null; }
    },
    set(value) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(value)); }
      catch (e) { /* 隐私模式等场景下静默失败 */ }
    }
  };

  let users = [];          // 全部数据
  let keyword = '';        // 搜索关键字
  let editingId = null;    // 正在编辑的记录 id（null 表示新增）
  let pendingDeleteId = null;

  // 初始演示数据
  function seedData() {
    return [
      { id: 1, name: '张三', age: 28, email: 'zhangsan@example.com', dept: '技术部' },
      { id: 2, name: '李四', age: 34, email: 'lisi@example.com',     dept: '产品部' },
      { id: 3, name: '王五', age: 25, email: 'wangwu@example.com',   dept: '设计部' }
    ];
  }

  /* ============ 2. 工具函数 ============ */
  const $ = id => document.getElementById(id);

  // 转义 HTML，防止 XSS
  function esc(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function nextId() {
    return users.reduce((max, u) => Math.max(max, u.id), 0) + 1;
  }

  let toastTimer = null;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1900);
  }

  /* ============ 3. 查询 + 渲染 ============ */
  function getFiltered() {
    const k = keyword.trim().toLowerCase();
    if (!k) return users;
    return users.filter(u =>
      u.name.toLowerCase().includes(k) ||
      u.email.toLowerCase().includes(k) ||
      u.dept.toLowerCase().includes(k)
    );
  }

  function render() {
    const list = getFiltered();
    const tbody = $('tbody');

    tbody.innerHTML = list.map(u => `
      <tr>
        <td>${u.id}</td>
        <td>${esc(u.name)}</td>
        <td>${esc(u.age)}</td>
        <td>${esc(u.email)}</td>
        <td><span class="tag">${esc(u.dept)}</span></td>
        <td class="ops">
          <button class="btn btn-sm" data-act="edit" data-id="${u.id}">编辑</button>
          <button class="btn btn-sm btn-danger" data-act="del" data-id="${u.id}">删除</button>
        </td>
      </tr>
    `).join('');

    // 空状态
    const empty = $('emptyState');
    if (list.length === 0) {
      empty.style.display = 'block';
      empty.textContent = users.length === 0
        ? '暂无数据，点击右上角「新增用户」开始添加'
        : '没有找到匹配的记录，试试其他关键字';
    } else {
      empty.style.display = 'none';
    }

    // 统计
    $('count').textContent = keyword.trim()
      ? `匹配 ${list.length} 条，共 ${users.length} 条记录`
      : `共 ${users.length} 条记录`;
  }

  /* ============ 4. 表单弹窗 ============ */
  function clearErrors() {
    ['fName', 'fAge', 'fEmail'].forEach(id => {
      $(id).classList.remove('invalid');
      $('err-' + id).textContent = '';
    });
  }

  function setError(id, msg) {
    $(id).classList.add('invalid');
    $('err-' + id).textContent = msg;
  }

  function openForm(user) {
    editingId = user ? user.id : null;
    $('modalTitle').textContent = user ? '编辑用户' : '新增用户';
    clearErrors();

    $('fName').value  = user ? user.name  : '';
    $('fAge').value   = user ? user.age   : '';
    $('fEmail').value = user ? user.email : '';
    $('fDept').value  = user ? user.dept  : '技术部';

    $('modalMask').classList.add('show');
    setTimeout(() => $('fName').focus(), 60);
  }

  function closeForm() {
    $('modalMask').classList.remove('show');
    editingId = null;
    clearErrors();
  }

  /* ============ 5. 增 / 改 ============ */
  function handleSubmit(e) {
    e.preventDefault();
    clearErrors();

    const name  = $('fName').value.trim();
    const ageRaw = $('fAge').value.trim();
    const email = $('fEmail').value.trim();
    const dept  = $('fDept').value;

    // ---- 校验 ----
    let valid = true;

    if (!name) {
      setError('fName', '姓名不能为空');
      valid = false;
    }

    const age = Number(ageRaw);
    if (!ageRaw) {
      setError('fAge', '年龄不能为空');
      valid = false;
    } else if (!Number.isInteger(age) || age < 1 || age > 150) {
      setError('fAge', '请输入 1 ~ 150 之间的整数');
      valid = false;
    }

    if (!email) {
      setError('fEmail', '邮箱不能为空');
      valid = false;
    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      setError('fEmail', '邮箱格式不正确');
      valid = false;
    }

    if (!valid) return;

    // ---- 保存 ----
    if (editingId !== null) {
      const target = users.find(u => u.id === editingId);
      if (target) Object.assign(target, { name, age, email, dept });
      toast('修改成功');
    } else {
      users.push({ id: nextId(), name, age, email, dept });
      toast('添加成功');
    }

    store.set(users);
    closeForm();
    render();
  }

  /* ============ 6. 删 ============ */
  function askDelete(id) {
    const user = users.find(u => u.id === id);
    if (!user) return;
    pendingDeleteId = id;
    $('confirmText').textContent = `确定要删除用户「${user.name}」吗？该操作不可撤销。`;
    $('confirmMask').classList.add('show');
  }

  function confirmDelete() {
    if (pendingDeleteId === null) return;
    users = users.filter(u => u.id !== pendingDeleteId);
    store.set(users);
    pendingDeleteId = null;
    $('confirmMask').classList.remove('show');
    render();
    toast('已删除');
  }

  /* ============ 7. 事件绑定 ============ */
  function bindEvents() {
    // 新增
    $('addBtn').addEventListener('click', () => openForm(null));

    // 表格操作（事件委托）
    $('tbody').addEventListener('click', e => {
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      const id = Number(btn.dataset.id);

      if (btn.dataset.act === 'edit') {
        const user = users.find(u => u.id === id);
        if (user) openForm(user);
      } else if (btn.dataset.act === 'del') {
        askDelete(id);
      }
    });

    // 搜索
    $('searchInput').addEventListener('input', e => {
      keyword = e.target.value;
      render();
    });

    // 表单提交
    $('userForm').addEventListener('submit', handleSubmit);

    // 取消 / 关闭
    $('cancelBtn').addEventListener('click', closeForm);
    $('modalMask').addEventListener('click', e => {
      if (e.target === $('modalMask')) closeForm();
    });

    // 删除确认
    $('okDelBtn').addEventListener('click', confirmDelete);
    $('cancelDelBtn').addEventListener('click', () => {
      pendingDeleteId = null;
      $('confirmMask').classList.remove('show');
    });
    $('confirmMask').addEventListener('click', e => {
      if (e.target === $('confirmMask')) {
        pendingDeleteId = null;
        $('confirmMask').classList.remove('show');
      }
    });

    // ESC 关闭弹窗
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if ($('confirmMask').classList.contains('show')) {
        pendingDeleteId = null;
        $('confirmMask').classList.remove('show');
      } else if ($('modalMask').classList.contains('show')) {
        closeForm();
      }
    });

    // 输入时清除该字段的错误提示
    ['fName', 'fAge', 'fEmail'].forEach(id => {
      $(id).addEventListener('input', () => {
        $(id).classList.remove('invalid');
        $('err-' + id).textContent = '';
      });
    });
  }

  /* ============ 8. 初始化 ============ */
  function init() {
    const saved = store.get();
    if (Array.isArray(saved)) {
      users = saved;
    } else {
      users = seedData();   // 首次访问，写入演示数据
      store.set(users);
    }
    bindEvents();
    render();
  }

  init();
})();
</script>
</body>
</html>
